<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C Code Visualizer 回帰テスト</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#0f0f10;
      --panel:#18181a;
      --line:#303035;
      --text:#eeeeef;
      --muted:#a9a9b0;
      --accent:#53c8ff;
      --pass:#67d391;
      --fail:#ff6b78;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main{
      width:min(1100px, calc(100% - 32px));
      margin:40px auto 64px;
    }

    header,
    .summary,
    .test-list{
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--panel);
    }

    header{ padding:24px; }
    h1{ margin:0 0 8px; font-size:clamp(24px, 4vw, 36px); }
    p{ margin:6px 0; color:var(--muted); line-height:1.7; }
    a{ color:var(--accent); }

    button{
      margin-top:16px;
      border:0;
      border-radius:8px;
      padding:10px 16px;
      background:var(--accent);
      color:#07131a;
      font-weight:700;
      cursor:pointer;
    }

    .summary{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:12px;
      margin:16px 0;
      padding:16px;
    }

    .summary-card{
      padding:14px;
      border:1px solid var(--line);
      border-radius:10px;
      text-align:center;
    }

    .summary-value{ display:block; font-size:28px; font-weight:800; }
    .summary-label{ color:var(--muted); font-size:13px; }
    .pass-text{ color:var(--pass); }
    .fail-text{ color:var(--fail); }

    .test-list{ overflow:hidden; }
    .test-row{
      display:grid;
      grid-template-columns:88px minmax(180px, 0.8fr) minmax(260px, 1.7fr);
      gap:14px;
      align-items:start;
      padding:14px 18px;
      border-bottom:1px solid var(--line);
    }
    .test-row:last-child{ border-bottom:0; }

    .badge{
      display:inline-block;
      border-radius:999px;
      padding:4px 10px;
      text-align:center;
      font-size:12px;
      font-weight:800;
    }
    .badge-pass{ background:rgba(103, 211, 145, .14); color:var(--pass); }
    .badge-fail{ background:rgba(255, 107, 120, .14); color:var(--fail); }
    .test-name{ font-weight:700; }
    .test-detail{ color:var(--muted); font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:13px; line-height:1.6; white-space:pre-wrap; }

    #testSandbox{
      position:fixed;
      left:-10000px;
      top:0;
      width:1px;
      height:1px;
      overflow:hidden;
    }

    @media (max-width:720px){
      .summary{ grid-template-columns:1fr; }
      .test-row{ grid-template-columns:1fr; gap:8px; }
      .badge{ width:max-content; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>C Code Visualizer 回帰テスト</h1>
      <p>主要な入力例を自動実行し、出力・変数・警告・実行ステップを確認する開発用ページです。</p>
      <p>このページは製品画面を変更せず、公開中の <code>script.js</code> をそのまま読み込んで検査します。</p>
      <p><a href="index.html">C Code Visualizerへ戻る</a></p>
      <button type="button" id="runTests">すべて再実行</button>
    </header>

    <section class="summary" aria-live="polite">
      <div class="summary-card">
        <span class="summary-value" id="totalCount">0</span>
        <span class="summary-label">全テスト</span>
      </div>
      <div class="summary-card">
        <span class="summary-value pass-text" id="passCount">0</span>
        <span class="summary-label">成功</span>
      </div>
      <div class="summary-card">
        <span class="summary-value fail-text" id="failCount">0</span>
        <span class="summary-label">失敗</span>
      </div>
    </section>

    <section class="test-list" id="testResults" aria-label="テスト結果"></section>
  </main>

  <div id="testSandbox" aria-hidden="true">
    <textarea id="codeInput"></textarea>
    <textarea id="scanfInput"></textarea>
    <pre id="codeHighlight"></pre>
    <pre id="codeLineNumbers"></pre>
    <div id="outputResult"></div>
    <div id="variableState"></div>
    <div id="stepResult"></div>
    <div id="codePreview"></div>
    <div id="hintResult"></div>
  </div>

  <script src="script.js"></script>
  <script>
    function makeMainCode(body){
      return `#include <stdio.h>\n\nint main(void){\n${body}\n}`;
    }

    const testCases = [
      {
        name:'基本の宣言・加算・printf',
        code:`#include <stdio.h>\n\nint main(void){\n    int a = 3;\n    int b = 5;\n    int c = a + b;\n    printf("%d\\n", c);\n    return 0;\n}`,
        expect:{
          output:'8',
          variables:['a = 3', 'b = 5', 'c = 8'],
          warningMax:0,
          syntaxClasses:['syntax-preprocessor', 'syntax-header', 'syntax-type', 'syntax-function', 'syntax-string', 'syntax-keyword', 'syntax-number', 'syntax-operator']
        }
      },
      {
        name:'if〜elseサンプル',
        code:samples.ifElse,
        expect:{ output:'もう一度挑戦', variables:['score = 45'], warningMax:0, executedIncludes:['printf("もう一度挑戦'], executedExcludes:['printf("合格です'] }
      },
      {
        name:'入れ子ifで選択分岐後も処理を継続',
        code:`#include <stdio.h>\n\nint main(void){\n    int score = 85;\n\n    if(score >= 60){\n        printf("合格です\\n");\n\n        if(score >= 80){\n            printf("高得点です\\n");\n        }\n    }\n\n    return 0;\n}`,
        expect:{
          output:'合格です\n高得点です',
          variables:['score = 85'],
          warningMax:0,
          stepsInOrder:['score >= 60を判定しました', '画面に「合格です', '入れ子のif文の条件 score >= 80 を判定しました', '画面に「高得点です', 'プログラムを終了します'],
          executedIncludes:['if(score >= 60){', 'printf("合格です', 'if(score >= 80){', 'printf("高得点です', 'return 0;']
        }
      },
      {
        name:'入れ子ifサンプル',
        code:samples.nestedIf,
        loadSampleKey:'nestedIf',
        expect:{
          output:'合格です',
          variables:['score = 75'],
          warningMax:0,
          stepsInOrder:['score >= 60を判定しました', '入れ子のif文の条件 score >= 80 を判定しました', '画面に「合格です', 'プログラムを終了します'],
          executedIncludes:['if(score >= 60){', 'if(score >= 80){', 'printf("合格です', 'return 0;'],
          executedExcludes:['printf("高得点です'],
          editorScrollTop:0,
          editorScrollLeft:0
        }
      },
      {
        name:'for文サンプル・5反復を全説明表示',
        code:samples.forBasic,
        loadSampleKey:'forBasic',
        expect:{
          output:'0\n1\n2\n3\n4',
          variables:['i = 5'],
          warningMax:0,
          scanfInputValue:'',
          stepsInclude:['【1回目】', '【5回目】', '【終了判定】', '【for終了】'],
          stepsExclude:['反復を省略しました'],
          stepCounts:{ 'for文の条件':6, 'for文の更新':5, '反復を省略しました':0 },
          executedIncludes:['for(i = 0; i < 5; i++){', 'printf("%d\\n", i);', 'return 0;'],
          editorScrollTop:0,
          editorScrollLeft:0
        }
      },
      {
        name:'Ver.0.10.0 配列正式サンプル・forで5要素を順に参照',
        code:samples.arrayFor,
        loadSampleKey:'arrayFor',
        expect:{
          output:'10\n20\n30\n40\n50',
          variables:['i = 5'],
          arrays:[{ name:'a', values:['10', '20', '30', '40', '50'], firstIndex:'[0]', lastIndex:'[4]' }],
          warningMax:0,
          scanfInputValue:'',
          stepArrayCount:5,
          stepArrays:[
            { name:'a', activeIndex:'[0]', accessLabel:'参照', sourceIndex:'i', resolvedIndex:0, resolutionIncludes:'a[i]→a[0]' },
            { name:'a', activeIndex:'[1]', accessLabel:'参照', sourceIndex:'i', resolvedIndex:1, resolutionIncludes:'a[i]→a[1]' },
            { name:'a', activeIndex:'[2]', accessLabel:'参照', sourceIndex:'i', resolvedIndex:2, resolutionIncludes:'a[i]→a[2]' },
            { name:'a', activeIndex:'[3]', accessLabel:'参照', sourceIndex:'i', resolvedIndex:3, resolutionIncludes:'a[i]→a[3]' },
            { name:'a', activeIndex:'[4]', accessLabel:'参照', sourceIndex:'i', resolvedIndex:4, resolutionIncludes:'a[i]→a[4]' }
          ],
          finalActiveCount:0,
          executedIncludes:['int a[5] = {10, 20, 30, 40, 50};', 'for(i = 0; i < 5; i++){', 'printf("%d\\n", a[i]);', 'return 0;'],
          editorScrollTop:0,
          editorScrollLeft:0
        }
      },
      {
        name:'Ver.0.9 while文正式サンプル・1から5を全説明表示',
        code:samples.whileBasic,
        loadSampleKey:'whileBasic',
        expect:{
          output:'1\n2\n3\n4\n5',
          variables:['i = 6'],
          warningMax:0,
          scanfInputValue:'',
          stepsInclude:['【1回目】', '【5回目】', '【終了判定】', '【while終了】'],
          stepsExclude:['反復説明を省略しました'],
          stepCounts:{ 'while文の条件':6, '反復説明を省略しました':0 },
          executedIncludes:['while(i <= 5){', 'printf("%d\\n", i);', 'i++;', 'return 0;'],
          editorScrollTop:0,
          editorScrollLeft:0
        }
      },
      {
        name:'for＋ifサンプル・偶数出力と10反復圧縮',
        code:samples.forIf,
        loadSampleKey:'forIf',
        expect:{
          output:'0\n2\n4\n6\n8',
          variables:['i = 10'],
          warningMax:0,
          scanfInputValue:'',
          stepsInclude:['4～9回目の反復を省略しました', '【10回目】', '【終了判定】', '【for終了】'],
          stepCounts:{ 'for文の条件':5, 'for文の更新':4, '反復を省略しました':1 },
          analysisByLineIncludes:{
            '6':['4～9回目の反復を省略しました', '【10回目】'],
            '7':['4～9回目の反復を省略しました', '【10回目】'],
            '8':['4～9回目の反復を省略しました', '【10回目】']
          },
          executedIncludes:['for(i = 0; i < 10; i++){', 'if(i % 2 == 0){', 'printf("%d\\n", i);', 'return 0;'],
          editorScrollTop:0,
          editorScrollLeft:0
        }
      },
      {
        name:'Stage3 入れ子forサンプル・段階的な星を表示',
        code:samples.nestedFor,
        loadSampleKey:'nestedFor',
        expect:{
          output:'*\n**\n***',
          variables:['i = 4', 'j = 4'],
          warningMax:0,
          scanfInputValue:'',
          stepsInclude:['【外側for：1回目】', '【外側for：1回目｜内側for：1周目】', '【外側for：終了】'],
          stepsExclude:['【内側for：1周目】', '外側for・', '内側for・', '最奥for・'],
          executedIncludes:['for(i = 1; i <= 3; i++){', 'for(j = 1; j <= i; j++){', 'printf("*");', 'printf("\\n");', 'return 0;'],
          editorScrollTop:0,
          editorScrollLeft:0
        }
      },
      {
        name:'scanf正式サンプル・75を入力して合格',
        code:samples.scanfInput,
        loadSampleKey:'scanfInput',
        expect:{
          output:'合格です',
          outputExcludes:['不合格です'],
          variables:['score = 75'],
          warningMax:0,
          scanfInputValue:'75',
          stepsInOrder:['入力値 75', 'score >= 60を判定しました', '画面に「合格です', 'プログラムを終了します'],
          executedIncludes:['scanf("%d", &score);', 'if(score >= 60){', 'printf("合格です', 'return 0;'],
          executedExcludes:['printf("不合格です']
        }
      },
      {
        name:'既存サンプル読込時はscanf入力値を残さない',
        code:samples.basic,
        input:'99',
        loadSampleKey:'basic',
        expect:{ output:'8', variables:['a = 3', 'b = 5', 'c = 8'], warningMax:0, scanfInputValue:'' }
      },
      {
        name:'再代入',
        code:`#include <stdio.h>\n\nint main(void){\n    int score = 60;\n    score = score + 15;\n    printf("%d\\n", score);\n    return 0;\n}`,
        expect:{ output:'75', variables:['score = 75'], warningMax:0 }
      },
      {
        name:'四則演算と比較結果',
        code:`#include <stdio.h>\n\nint main(void){\n    int a;\n    a = 5;\n    int total = (a + 3) * 2;\n    int result = total >= 16;\n    printf("%d %d\\n", total, result);\n    return 0;\n}`,
        expect:{ output:'16 1', variables:['a = 5', 'total = 16', 'result = 1'], warningMax:0 }
      },
      {
        name:'if条件成立・printf実行',
        code:`#include <stdio.h>\n\nint main(void){\n    int score = 78;\n    if(score >= 60){\n        printf("合格です\\n");\n    }\n    return 0;\n}`,
        expect:{ output:'合格です', variables:['score = 78'], warningMax:0, stepsInclude:['条件が成立したため'] }
      },
      {
        name:'if条件不成立・本文スキップ',
        code:`#include <stdio.h>\n\nint main(void){\n    int score = 45;\n    if(score >= 60){\n        printf("合格です\\n");\n    }\n    printf("判定終了\\n");\n    return 0;\n}`,
        expect:{ output:'判定終了', outputExcludes:['合格です'], variables:['score = 45'], warningMax:0, executedExcludes:['printf("合格です'] }
      },
      {
        name:'if内の代入・条件成立',
        code:`#include <stdio.h>\n\nint main(void){\n    int result = 0;\n    int score = 78;\n    if(score >= 60){\n        result = 1;\n    }\n    printf("%d\\n", result);\n    return 0;\n}`,
        expect:{ output:'1', variables:['result = 1', 'score = 78'], warningMax:0, executedIncludes:['result = 1;'] }
      },
      {
        name:'if内の代入・条件不成立',
        code:`#include <stdio.h>\n\nint main(void){\n    int result = 0;\n    int score = 45;\n    if(score >= 60){\n        result = 1;\n    }\n    printf("%d\\n", result);\n    return 0;\n}`,
        expect:{ output:'0', variables:['result = 0', 'score = 45'], warningMax:0, executedExcludes:['result = 1;'] }
      },
      {
        name:'未初期化変数を条件に使用',
        code:`#include <stdio.h>\n\nint main(void){\n    int score;\n    if(score >= 60){\n        printf("合格です\\n");\n    }\n    printf("判定終了\\n");\n    return 0;\n}`,
        expect:{ output:'判定終了', variables:['score = 未初期化'], warningMin:1, hintsInclude:['まだ値が代入されていません'], executedExcludes:['printf("合格です'] }
      },
      {
        name:'未宣言変数を条件に使用',
        code:`#include <stdio.h>\n\nint main(void){\n    if(score >= 60){\n        printf("合格です\\n");\n    }\n    printf("判定終了\\n");\n    return 0;\n}`,
        expect:{ output:'判定終了', warningMin:1, hintsInclude:['宣言されていません'], executedExcludes:['printf("合格です'] }
      },
      {
        name:'複数の独立したif',
        code:`#include <stdio.h>\n\nint main(void){\n    int score = 78;\n    if(score >= 60){\n        printf("合格\\n");\n    }\n    if(score >= 80){\n        printf("優秀\\n");\n    }\n    return 0;\n}`,
        expect:{ output:'合格', outputExcludes:['優秀'], variables:['score = 78'], warningMax:0 }
      },
      {
        name:'if内の変数宣言は未対応',
        code:`#include <stdio.h>\n\nint main(void){\n    int score = 78;\n    if(score >= 60){\n        int bonus = 5;\n    }\n    printf("終了\\n");\n    return 0;\n}`,
        expect:{ output:'終了', variables:['score = 78'], variablesExclude:['bonus ='], warningMin:1, hintsInclude:['分岐内の変数宣言は未対応'] }
      },
      {
        name:'入れ子if・外側成立・内側成立',
        code:`#include <stdio.h>\n\nint main(void){\n    int a = 1;\n    int b = 1;\n    if(a > 0){\n        if(b > 0){\n            printf("INNER\\n");\n        }\n    }\n    printf("終了\\n");\n    return 0;\n}`,
        expect:{ output:'INNER\n終了', warningMax:0, stepsInclude:['入れ子のif文の条件 b > 0 を判定しました。条件が成立したため'], executedIncludes:['printf("INNER'] }
      },
      {
        name:'if〜else条件不成立・else側を実行',
        code:`#include <stdio.h>\n\nint main(void){\n    int score = 45;\n    if(score >= 60){\n        printf("合格\\n");\n    }else{\n        printf("不合格\\n");\n    }\n    printf("判定終了\\n");\n    return 0;\n}`,
        expect:{ output:'不合格\n判定終了', warningMax:0, stepsInclude:['else文の中へ進みます'], executedIncludes:['printf("不合格'], executedExcludes:['printf("合格'] }
      },
      {
        name:'if〜else条件成立・if側だけを実行',
        code:`#include <stdio.h>\n\nint main(void){\n    int score = 78;\n    if(score >= 60){\n        printf("合格\\n");\n    } else {\n        printf("不合格\\n");\n    }\n    return 0;\n}`,
        expect:{ output:'合格', outputExcludes:['不合格'], warningMax:0, stepsInclude:['else文の中は実行しません'], executedIncludes:['printf("合格'], executedExcludes:['printf("不合格'] }
      },
      {
        name:'別行else形式・else側の代入',
        code:`#include <stdio.h>\n\nint main(void){\n    int score = 45;\n    int result = 0;\n    if(score >= 60){\n        result = 1;\n    }\n    else{\n        result = -1;\n    }\n    printf("%d\\n", result);\n    return 0;\n}`,
        expect:{ output:'-1', variables:['score = 45', 'result = -1'], warningMax:0, executedIncludes:['result = -1;'], executedExcludes:['result = 1;'] }
      },
      {
        name:'複数の独立したif〜else',
        code:`#include <stdio.h>\n\nint main(void){\n    int first = 0;\n    int second = 0;\n    if(1){\n        first = 1;\n    }else{\n        first = 9;\n    }\n    if(0){\n        second = 9;\n    }else{\n        second = 2;\n    }\n    printf("%d %d\\n", first, second);\n    return 0;\n}`,
        expect:{ output:'1 2', variables:['first = 1', 'second = 2'], warningMax:0 }
      },
      {
        name:'if〜elseの条件を評価できないとき両側を実行しない',
        code:`#include <stdio.h>\n\nint main(void){\n    int result = 0;\n    if(score >= 60){\n        result = 1;\n        printf("WRONG-IF\\n");\n    }else{\n        result = 2;\n        printf("WRONG-ELSE\\n");\n    }\n    printf("%d\\n", result);\n    return 0;\n}`,
        expect:{ output:'0', outputExcludes:['WRONG-IF', 'WRONG-ELSE'], variables:['result = 0'], warningMin:1, hintsInclude:['宣言されていません'], executedExcludes:['result = 1;', 'result = 2;', 'printf("WRONG'] }
      },
      {
        name:'else側の変数宣言は未対応',
        code:`#include <stdio.h>\n\nint main(void){\n    int score = 45;\n    if(score >= 60){\n        printf("合格\\n");\n    }else{\n        int bonus = 5;\n        printf("再挑戦\\n");\n    }\n    return 0;\n}`,
        expect:{ output:'出力はまだありません。', outputExcludes:['合格', '再挑戦'], variables:['score = 45'], variablesExclude:['bonus ='], warningMin:1, hintsInclude:['分岐内の変数宣言は未対応'], executedExcludes:['int bonus = 5;', 'printf("再挑戦'] }

        expect:{ output:'WRONG-B\n判定終了', outputExcludes:['WRONG-A', 'WRONG-C'], warningMax:0, decisions:[{condition:'score >= 80',result:false,selected:'next',skipped:'if'},{condition:'score >= 60',result:true,selected:'else-if',skipped:'remaining'}] }
      },
      {
        name:'if〜elseのelse側にある入れ子if',
        code:`#include <stdio.h>\n\nint main(void){\n    int value = 0;\n    if(0){\n        value = 1;\n    }else{\n        if(1){\n            value = 9;\n        }\n    }\n    printf("%d\\n", value);\n    return 0;\n}`,
        expect:{ output:'9', variables:['value = 9'], warningMax:0, stepsInclude:['入れ子のif文の条件 1 を判定しました。条件が成立したため'], executedIncludes:['value = 9;'], executedExcludes:['value = 1;'] }
      },
      {
        name:'else側・内側条件不成立後も処理を続行',
        code:`#include <stdio.h>\n\nint main(void){\n    int value = 0;\n    if(value){\n        value = 9;\n        printf("WRONG-IF\\n");\n    }else{\n        if(value > 0){\n            value = 8;\n            printf("WRONG-INNER-FALSE\\n");\n        }\n        value = 2;\n        printf("ELSE-AFTER %d\\n", value);\n    }\n    return 0;\n}`,
        expect:{ output:'ELSE-AFTER 2', outputExcludes:['WRONG-IF', 'WRONG-INNER-FALSE'], variables:['value = 2'], warningMax:0, stepsInclude:['入れ子のif文の条件 value > 0 を判定しました。条件が成立しなかったため'], executedIncludes:['value = 2;', 'printf("ELSE-AFTER'], executedExcludes:['value = 9;', 'value = 8;', 'printf("WRONG'] }
      },
      {
        name:'入れ子if・外側成立・内側不成立',
        code:`#include <stdio.h>\n\nint main(void){\n    int score = 70;\n    if(score >= 60){\n        if(score >= 80){\n            printf("WRONG-INNER-FALSE\\n");\n        }\n        printf("外側は続行\\n");\n    }\n    return 0;\n}`,
        expect:{ output:'外側は続行', outputExcludes:['WRONG-INNER-FALSE'], warningMax:0, stepsInclude:['入れ子のif文の条件 score >= 80 を判定しました。条件が成立しなかったため'], executedExcludes:['printf("WRONG-INNER-FALSE'] }
      },
      {

      }

        const activeCell = card.querySelector('.array-cell-active');
        return {
          name:normalizeText(card.querySelector('.array-name')?.textContent),
          type:normalizeText(card.querySelector('.array-type')?.textContent),
          values:[...card.querySelectorAll('.array-value')].map(element => normalizeText(element.textContent)),

          resolution:normalizeText(card.querySelector('.array-access-resolution')?.textContent)

        .map(readArrayCard);

        failures.push(`コード入力欄: 期待「${expected.codeInputValue}」/ 実際「${actual.codeInputValue}」`);
      }

      if(expected.scanfInputValue !== undefined && actual.scanfInputValue !== expected.scanfInputValue){
        failures.push(`scanf入力欄: 期待「${expected.scanfInputValue}」/ 実際「${actual.scanfInputValue}」`);
      }

      if(expected.editorScrollTop !== undefined && actual.editorScrollTop !== expected.editorScrollTop){
        failures.push(`入力欄の縦スクロール位置: 期待${expected.editorScrollTop} / 実際${actual.editorScrollTop}`);
      }

      if(expected.editorScrollLeft !== undefined && actual.editorScrollLeft !== expected.editorScrollLeft){
        failures.push(`入力欄の横スクロール位置: 期待${expected.editorScrollLeft} / 実際${actual.editorScrollLeft}`);
      }

      if(expected.output !== undefined && actual.output !== expected.output){
        failures.push(`出力: 期待「${expected.output}」/ 実際「${actual.output}」`);
      }

      for(const text of expected.outputExcludes || []){
        if(actual.output.includes(text)) failures.push(`出力に「${text}」を含めない`);
      }

      for(const text of expected.variables || []){
        if(!actual.variables.includes(text)) failures.push(`変数に「${text}」がない`);
      }

      for(const text of expected.variablesExclude || []){
        if(actual.variables.some(variable => variable.includes(text))) failures.push(`変数に「${text}」を含めない`);
      }

      // Lite bridgeはUIと履歴へ渡す形式を保ったまま、型metadataを別tableに持ちます。
      const bridge = window.cVisualizerLiteResult;

      if(expected.phase1){
        const all = bridge.steps;
        if(all.some(step => typeof step.outputAtStep !== 'string' || !Array.isArray(step.variablesAtStep) ||
          step.variablesAtStep.some(pair => !Array.isArray(pair) || pair.length !== 2 || typeof pair[1] !== 'string'))){
          failures.push('P1: 全STEPの出力・スカラーsnapshot契約が必要');
        }
        const arrays = all.map(step => step.variablesAtStep);
        const pairs = arrays.filter(Array.isArray).flat();
        if(new Set(arrays).size !== arrays.length || new Set(pairs).size !== pairs.length){
          failures.push('P1: STEP間でsnapshotまたはpair参照を共有している');
        }
        if(expected.phase1.omissions){
          const actualOmissions = all.filter(step => step.stepKind === 'loop-omission');
          if(actualOmissions.length !== expected.phase1.omissions.length) failures.push('P1: 省略STEP数/識別子が違う');
          expected.phase1.omissions.forEach((want,index) => {
            const step=actualOmissions[index]; if(!step) return;
            const range=step.omittedRange;
            if(!range || range.first!==want.first || range.last!==want.last || range.kind!==want.kind || range.sourceLine!==step.lineNo) failures.push('P1: 省略範囲metadataが違う');
            if(step.branchDecision || step.loopDecision || step.scanfInput) failures.push('P1: 省略を実行/条件として扱っている');
            if(step.outputAtStep!==want.output) failures.push('P1: 省略末尾の出力が違う: '+JSON.stringify(step.outputAtStep));
            for(const [name,value] of Object.entries(want.vars)){
              if(new Map(step.variablesAtStep).get(name)!==value) failures.push('P1: 省略末尾の変数 '+name+' が違う');
            }
            const next=all[all.indexOf(step)+1];
            if(JSON.stringify(next.variablesAtStep)!==JSON.stringify(step.variablesAtStep) || next.outputAtStep!==step.outputAtStep) failures.push('P1: 次条件への偽の状態変化');
          });
        }
      }

      if(expected.missingReturnZero !== undefined &&
         bridge.learningHints?.missingReturnZero !== expected.missingReturnZero){
        failures.push('構造化されたreturn省略ヒントの判定が違います');
      }
      for(const [key, value] of Object.entries(expected.bridgeFlags || {})){
        if(bridge[key] !== value) failures.push(`bridge.${key}: 期待${value} / 実際${bridge[key]}`);
      }
      if(expected.stepLineNos && JSON.stringify(bridge.steps.map(step => step.lineNo)) !== JSON.stringify(expected.stepLineNos)){
        failures.push(`STEP行番号: 期待${expected.stepLineNos} / 実際${bridge.steps.map(step => step.lineNo)}`);
      }
      if(expected.waiting){
        if(bridge.inputRequired !== true || bridge.hasWarnings){
          failures.push('入力不足を警告ではなくWAITINGとして返していない');
        }
        for(const [key, value] of Object.entries(expected.waiting)){
          if(bridge.inputRequest?.[key] !== value){
            failures.push(`inputRequest.${key}: 期待「${value}」/ 実際「${bridge.inputRequest?.[key]}」`);
          }
        }
        if(!Number.isInteger(bridge.inputRequest?.lineNo)) failures.push('inputRequestの行番号がない');
      }else if(bridge.inputRequired || bridge.inputRequest){
        failures.push('入力不足ではないRUNへinputRequestが付いている');
      }
      if(expected.scanfSteps){
        const inputSteps = bridge.steps.filter(step => step.scanfInput);
        if(inputSteps.length !== expected.scanfSteps.length){
          failures.push(`scanf STEP数: 期待${expected.scanfSteps.length} / 実際${inputSteps.length}`);
        }
        expected.scanfSteps.forEach((wanted, index) => {
          const step = inputSteps[index];
          if(!step) return;
          for(const [key, value] of Object.entries(wanted)){
            if(step.scanfInput[key] !== value){
              failures.push(`scanf STEP ${index + 1}.${key}: 期待「${value}」/ 実際「${step.scanfInput[key]}」`);
            }
          }
          if(!Array.isArray(step.variablesAtStep) || typeof step.outputAtStep !== 'string'){
            failures.push(`scanf STEP ${index + 1}のLite snapshotがない`);
          }
        });
      }
      for(const [name, type] of Object.entries(expected.types || {})){
        if(bridge.variableTypes?.[name] !== type){
          failures.push(`${name}の型: 期待「${type}」/ 実際「${bridge.variableTypes?.[name]}」`);
        }
      }
      if(expected.types && Object.keys(expected.types).length === 0 && Object.keys(bridge.variableTypes || {}).length){
        failures.push('失敗した宣言の型metadataが残っている');
      }
      if(expected.bridgeVariables && JSON.stringify(bridge.variables) !== JSON.stringify(expected.bridgeVariables)){
        failures.push(`Lite RESULT変数: 期待「${JSON.stringify(expected.bridgeVariables)}」/ 実際「${JSON.stringify(bridge.variables)}」`);
      }
      for(const pair of expected.bridgeIncludes || []){
        if(!bridge.variables.some(current => current[0] === pair[0] && current[1] === pair[1])){
          failures.push(`Lite RESULT変数に「${pair.join(' = ')}」がない`);
        }
      }
      for(const pair of expected.stepVariables || []){
        if(!bridge.steps.some(step => (step.variablesAtStep || []).some(
          current => current[0] === pair[0] && current[1] === pair[1]
        ))) failures.push(`Lite STEP snapshotに「${pair.join(' = ')}」がない`);
      }
      if(expected.loopDecisionCount !== undefined){
        const loopDecisions = bridge.steps.filter(step => step.loopDecision?.kind === 'for').map(step => step.loopDecision);
        if(loopDecisions.length !== expected.loopDecisionCount){
          failures.push(`for判定STEP数: 期待${expected.loopDecisionCount} / 実際${loopDecisions.length}`);
        }
        if(loopDecisions.some(decision => decision.kind !== 'for' ||
          typeof decision.result !== 'boolean' || !Number.isInteger(decision.iteration) ||
          typeof decision.condition !== 'string')) failures.push('for判定metadataが不正');
        if(expected.loopLastResult !== undefined && loopDecisions.length &&
          loopDecisions.at(-1).result !== expected.loopLastResult){
          failures.push('最後のfor判定の成立/不成立が一致しない');
        }
        for(const depth of expected.loopDepthIncludes || []){
          if(!loopDecisions.some(decision => decision.depth === depth)) failures.push(`for階層${depth}がない`);
        }
      }
      if(expected.decisions){
        const decisions = bridge.steps.filter(step => step.branchDecision);
        if(decisions.length !== expected.decisions.length){
          failures.push(`判定STEP数: 期待${expected.decisions.length} / 実際${decisions.length}`);
        }
        expected.decisions.forEach((wanted, index) => {
          const step = decisions[index];
          const decision = step?.branchDecision;
          if(!decision) return;
          for(const key of ['kind', 'condition', 'result', 'selected', 'skipped']){
            const value = key === 'kind' ? 'if' : wanted[key];
            if(decision[key] !== value) failures.push(`判定${index + 1}の${key}: 期待「${value}」/ 実際「${decision[key]}」`);
          }
          if(decision.depth !== (wanted.depth ?? 1)){
            failures.push(`判定${index + 1}のdepth: 期待「${wanted.depth ?? 1}」/ 実際「${decision.depth}」`);
          }
          if(!Array.isArray(step.variablesAtStep) || typeof step.outputAtStep !== 'string'){
            failures.push(`判定${index + 1}のLite snapshotがない`);
          }
          if(expected.nonComparison && decision.comparison !== null){
            failures.push(`判定${index + 1}は非比較条件なのでcomparisonがnullではない`);
          }
          if(expected.evaluatedDisplay !== undefined && decision.evaluatedDisplay !== expected.evaluatedDisplay){
            failures.push(`判定値の表示: 期待「${expected.evaluatedDisplay}」/ 実際「${decision.evaluatedDisplay}」`);
          }
          if(expected.decisionOutputAtStep !== undefined && step.outputAtStep !== expected.decisionOutputAtStep){
            failures.push(`判定STEPの出力snapshot: 期待「${expected.decisionOutputAtStep}」/ 実際「${step.outputAtStep}」`);
          }
          if(expected.decisionVariablesAtStep &&
            JSON.stringify(step.variablesAtStep) !== JSON.stringify(expected.decisionVariablesAtStep)){
            failures.push(`判定STEPの変数snapshot: 期待「${JSON.stringify(expected.decisionVariablesAtStep)}」/ 実際「${JSON.stringify(step.variablesAtStep)}」`);
          }
        });
        // 同じ行の閉じ波括弧に続くelse ifも、条件判定STEPです。
        if(bridge.steps.some(step => step.branchDecision && !/^\s*(?:}\s*)?(?:else\s+)?if\s*\(/.test(
          testCase.code.split('\n')[step.lineNo - 1] || ''
        ))) failures.push('if以外のSTEPにbranchDecisionが付いている');
      }
      if(expected.comparison){
        const comparison = bridge.steps.find(step => step.branchDecision)?.branchDecision.comparison;
        if(!comparison || comparison.operator !== expected.comparison.operator ||
          !['left', 'right'].every(side => ['source', 'value', 'display'].every(key =>
            Object.is(comparison[side]?.[key], expected.comparison[side][key])))){
          failures.push('判定STEPの比較値・operator・表示値が一致しない');
        }
      }
      for(const fragment of expected.noStepsFor || []){
        if(bridge.steps.some(step => (testCase.code.split('\n')[step.lineNo - 1] || '').includes(fragment))){
          failures.push(`非実行行「${fragment}」のSTEPを作らない`);
        }
      }
      if(expected.expression){
        const expression = evaluateArithmeticExpression(
          expected.expression.source,
          expected.expression.variables || Object.create(null),
          null,
          expected.expression.types || null
        );
        if(!expression.ok || !Object.is(expression.value, expected.expression.value) ||
          expression.type !== expected.expression.type){
          failures.push(`型付き式「${expected.expression.source}」の内部値・型が一致しない`);
        }
      }

      if(expected.arrayCount !== undefined && actual.arrays.length !== expected.arrayCount){
        failures.push(`配列card数: 期待${expected.arrayCount}件 / 実際${actual.arrays.length}件`);
      }

      if(expected.arrayOrder){
        const actualOrder = actual.arrays.map(array => array.name);
        if(JSON.stringify(actualOrder) !== JSON.stringify(expected.arrayOrder)){
          failures.push(`配列順序: 期待「${expected.arrayOrder.join(', ')}」/ 実際「${actualOrder.join(', ')}」`);
        }
      }

      for(const expectedArray of expected.arrays || []){
        const actualArray = actual.arrays.find(array => array.name === expectedArray.name);
        if(!actualArray){
          failures.push(`配列「${expectedArray.name}」がない`);
          continue;
        }
        if(expectedArray.type !== undefined && actualArray.type !== expectedArray.type){
          failures.push(`配列${expectedArray.name}の型表示: 期待「${expectedArray.type}」/ 実際「${actualArray.type}」`);
        }
        if(expectedArray.values && JSON.stringify(actualArray.values) !== JSON.stringify(expectedArray.values)){
          failures.push(`配列${expectedArray.name}の値: 期待「${expectedArray.values.join(', ')}」/ 実際「${actualArray.values.join(', ')}」`);
        }
        if(expectedArray.valueCount !== undefined && actualArray.values.length !== expectedArray.valueCount){
          failures.push(`配列${expectedArray.name}の要素数: 期待${expectedArray.valueCount} / 実際${actualArray.values.length}`);
        }
        if(expectedArray.firstIndex !== undefined && actualArray.indexes[0] !== expectedArray.firstIndex){
          failures.push(`配列${expectedArray.name}の先頭添字: 期待「${expectedArray.firstIndex}」/ 実際「${actualArray.indexes[0]}」`);
        }
        if(expectedArray.lastIndex !== undefined && actualArray.indexes.at(-1) !== expectedArray.lastIndex){
          failures.push(`配列${expectedArray.name}の末尾添字: 期待「${expectedArray.lastIndex}」/ 実際「${actualArray.indexes.at(-1)}」`);
        }
        if(expectedArray.legendIncludes !== undefined && !actualArray.legend.includes(expectedArray.legendIncludes)){
          failures.push(`配列${expectedArray.name}の凡例に「${expectedArray.legendIncludes}」がない`);
        }
      }

      if(expected.stepArrayCount !== undefined && actual.stepArrays.length !== expected.stepArrayCount){
        failures.push(`STEP内array card数: 期待${expected.stepArrayCount}件 / 実際${actual.stepArrays.length}件`);
      }

      for(const [index, expectedArray] of (expected.stepArrays || []).entries()){
        const actualArray = actual.stepArrays[index];
        if(!actualArray){
          failures.push(`STEP内${index + 1}番目のarray cardがない`);
          continue;
        }
        if(expectedArray.name !== undefined && actualArray.name !== expectedArray.name){
          failures.push(`STEP内配列名: 期待「${expectedArray.name}」/ 実際「${actualArray.name}」`);
        }
        if(expectedArray.values && JSON.stringify(actualArray.values) !== JSON.stringify(expectedArray.values)){
          failures.push(`STEP内配列${actualArray.name}の値: 期待「${expectedArray.values.join(', ')}」/ 実際「${actualArray.values.join(', ')}」`);
        }
        if(expectedArray.activeIndex !== undefined && actualArray.activeIndex !== expectedArray.activeIndex){
          failures.push(`STEP内active添字: 期待「${expectedArray.activeIndex}」/ 実際「${actualArray.activeIndex}」`);
        }
        if(expectedArray.accessLabel !== undefined && actualArray.accessLabel !== expectedArray.accessLabel){
          failures.push(`STEP内access label: 期待「${expectedArray.accessLabel}」/ 実際「${actualArray.accessLabel}」`);
        }
        if(expectedArray.sourceIndex !== undefined && actualArray.sourceIndex !== expectedArray.sourceIndex){
          failures.push(`STEP内sourceIndex: 期待「${expectedArray.sourceIndex}」/ 実際「${actualArray.sourceIndex}」`);
        }
        if(expectedArray.resolvedIndex !== undefined && actualArray.resolvedIndex !== String(expectedArray.resolvedIndex)){
          failures.push(`STEP内resolvedIndex: 期待「${expectedArray.resolvedIndex}」/ 実際「${actualArray.resolvedIndex}」`);
        }
        if(expectedArray.resolutionIncludes !== undefined && !actualArray.resolution.includes(expectedArray.resolutionIncludes)){
          failures.push(`STEP内index解決表示に「${expectedArray.resolutionIncludes}」がない`);
        }
      }

      if(expected.finalActiveCount !== undefined && actual.finalActiveCount !== expected.finalActiveCount){
        failures.push(`最終状態のactive cell数: 期待${expected.finalActiveCount}件 / 実際${actual.finalActiveCount}件`);
      }

      if(expected.warningMin !== undefined && actual.warningCount < expected.warningMin){
        failures.push(`警告数: ${expected.warningMin}件以上を期待 / 実際${actual.warningCount}件`);
      }

      if(expected.warningMax !== undefined && actual.warningCount > expected.warningMax){
        failures.push(`警告数: ${expected.warningMax}件以下を期待 / 実際${actual.warningCount}件`);
      }

      for(const text of expected.hintsInclude || []){
        if(!actual.hints.includes(text)) failures.push(`ヒントに「${text}」がない`);
      }

      for(const text of expected.hintsExclude || []){
        if(actual.hints.includes(text)) failures.push(`ヒントに「${text}」を含めない`);
      }

      for(const text of expected.stepsInclude || []){
        if(!actual.steps.includes(text)) failures.push(`STEPに「${text}」がない`);
      }

      for(const text of expected.stepsExclude || []){
        if(actual.steps.includes(text)) failures.push(`STEPに「${text}」を含めない`);
      }

      for(const [text, expectedCount] of Object.entries(expected.stepCounts || {})){
        const actualCount = actual.steps.split(text).length - 1;
        if(actualCount !== expectedCount){
          failures.push(`STEP内「${text}」の回数: 期待${expectedCount}回 / 実際${actualCount}回`);
        }
      }

      let stepSearchStart = 0;
      for(const text of expected.stepsInOrder || []){
        const stepIndex = actual.steps.indexOf(text, stepSearchStart);
        if(stepIndex === -1){
          failures.push(`STEP順序内に「${text}」がない`);
          continue;
        }
        stepSearchStart = stepIndex + text.length;
      }

      for(const text of expected.analysisInclude || []){
        if(!actual.analysis.includes(text)) failures.push(`行説明に「${text}」がない`);
      }

      for(const [lineNo, texts] of Object.entries(expected.analysisByLineIncludes || {})){
        const lineAnalysis = actual.analysisByLine[lineNo] || '';
        for(const text of texts){
          if(!lineAnalysis.includes(text)) failures.push(`${lineNo}行目の説明に「${text}」がない`);
        }
      }

      for(const [lineNo, texts] of Object.entries(expected.analysisByLineExcludes || {})){
        const lineAnalysis = actual.analysisByLine[lineNo] || '';
        for(const text of texts){
          if(lineAnalysis.includes(text)) failures.push(`${lineNo}行目の説明に「${text}」を含めない`);
        }
      }

      for(const [lineNo, textCounts] of Object.entries(expected.analysisByLineCounts || {})){
        const lineAnalysis = actual.analysisByLine[lineNo] || '';
        for(const [text, expectedCount] of Object.entries(textCounts)){
          const actualCount = lineAnalysis.split(text).length - 1;
          if(actualCount !== expectedCount){
            failures.push(`${lineNo}行目の説明内「${text}」の回数: 期待${expectedCount}回 / 実際${actualCount}回`);
          }
        }
      }

      for(const text of expected.executedIncludes || []){
        if(!actual.executedLines.some(line => line.includes(text))) failures.push(`実行行に「${text}」がない`);
      }

      for(const text of expected.executedExcludes || []){
        if(actual.executedLines.some(line => line.includes(text))) failures.push(`「${text}」を実行してはいけない`);
      }

      for(const className of expected.syntaxClasses || []){
        if(!actual.syntaxClasses.includes(className)) failures.push(`色分け要素に「${className}」がない`);
      }

      if(expected.phase2) checkPhase2Trace(bridge, expected.phase2, failures);
      return { passed:failures.length === 0, failures, actual };
    }

    function escapeTestHtml(value){
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // RUN演出が完了し、操作できるRESULTが表示されるまで待ちます。
    // 演出時間の固定値ではなく、製品画面の状態を検査します。
    async function waitForUiResult(ui){
      const deadline = Date.now() + 5000;
      while(Date.now() < deadline){
        if(ui.document.querySelector('.result-state') && ui.eval('hasCurrentResult()')) return;
        if(ui.document.querySelector('.failure-state')){
          throw new Error(`RUNが失敗しました: ${ui.document.querySelector('.failure-state').textContent}`);
        }
        await new Promise(resolve => ui.setTimeout(resolve, 20));
      }
      throw new Error('RUN後にRESULTが表示されません（5秒以内）');
    }

    // display:noneのiframeではfocusを検査できないため、画面外へ配置します。
    function createUiTestFrame(){
      const frame = document.createElement('iframe');
      frame.src = 'index.html';
      frame.style.cssText = 'position:fixed;left:-10000px;top:0;width:1200px;height:800px;border:0;';
      frame.setAttribute('title', '製品画面の回帰テスト');
      document.body.append(frame);
      return frame;
    }

    // 製品画面を別フレームで動かし、説明と判定カードの両立を確認します。
    async function checkDecisionUiCases(){
      const cases = [

          values:'85 >= 80', outcome:'成立TRUE', paths:['IF · 選択']},
        {name:'内側if-elseのfalse側',
          body:'int score = 70;\nif(score >= 60){\n    if(score >= 80){\n        printf("WRONG");\n    }else{\n        printf("PASS");\n    }\n}',
          decisionIndex:1, decisionCount:2, depth:2, context:'NESTED IF · 2段目',

          values:'70 >= 80', outcome:'不成立FALSE', paths:['IF · 通らない', 'ELSE · 選択']},
        {name:'外側falseなら内側STEPとjumpなし',
          body:'int score = 45;\nif(score >= 60){\n    if(undefinedValue){\n        printf("WRONG");\n    }\n}',
          decisionCount:1, depth:1, unjumpable:'if(undefinedValue)',
          explanation:['score の値', '60', '以上か'], outcome:'不成立FALSE'},

        });
        const ui = frame.contentWindow;
        const doc = ui.document;

        for(const testCase of cases){
          const failures = [];
          editor.setValue(makeMainCode(`    ${testCase.body.trim().split('\n').join('\n    ')}\n    return 0;`));
          doc.getElementById('visualize').click();
          const bridge = ui.cVisualizerLiteResult;
          if(bridge.hasWarnings) failures.push('条件の解析で警告が出ました');
          else await waitForUiResult(ui);
          doc.querySelector('.result-flow-button')?.click();
          const decisions = bridge.steps.filter(step => step.branchDecision);
          if(decisions.length !== (testCase.decisionCount ?? 1)) failures.push('判定STEP数が違います');
          const index = bridge.steps.findIndex(step => step === decisions[testCase.decisionIndex ?? 0]);
          if(index < 0){
            failures.push('判定STEPがありません');
          }else{
            if(bridge.steps[index].branchDecision.depth !== (testCase.depth ?? 1)) failures.push('階層metadataが違います');
            ui.eval(`activeStep = ${index}; renderStep()`);
            const children = [...doc.getElementById('flow-content').children];
            const order = ['step-top', 'step-track', 'step-code', 'flow-detail', 'decision-card', 'next-line'];
            if(children.map(item => item.className).join('|') !== order.join('|')) failures.push('FLOWの表示順が違います');
            const detail = doc.querySelector('.flow-detail');
            if(detail?.querySelector('small')?.textContent !== 'コードは何をしてる？') failures.push('説明見出しがありません');
            for(const word of testCase.explanation){
              if(!detail?.querySelector('p')?.textContent.includes(word)) failures.push(`説明に「${word}」がありません`);
            }
            if(/成立|不成立|TRUE|FALSE|選択|通らない/.test(detail?.querySelector('p')?.textContent || '')) failures.push('説明に判定結果が重複しています');
            if(testCase.values && !doc.querySelector('.decision-values')?.textContent.includes(testCase.values)) failures.push('判定値が違います');
            if(testCase.outcome && doc.querySelector('.decision-outcome')?.textContent !== testCase.outcome) failures.push('判定結果が違います');
            const context = doc.querySelector('.decision-context');
            if(testCase.context ? context?.textContent !== testCase.context : context !== null) failures.push('入れ子表示が違います');
            for(const path of testCase.paths || []){
              if(!doc.querySelector('.decision-paths')?.textContent.includes(path)) failures.push(`進路「${path}」がありません`);
            }
            if(doc.querySelector('.value-card')) failures.push('条件STEPに空の変数カードがあります');
            if(testCase.unjumpable){
              const line = editor.getValue().split('\n').findIndex(code => code.includes(testCase.unjumpable));
              if(ui.eval('jumpableLines').has(line)) failures.push('未評価の内側行へジャンプできます');
            }
            if(testCase.source){
              bridge.steps[index].text = '説明文として使わない';
              ui.eval('renderStep()');
              if(!doc.querySelector('.flow-detail p')?.textContent.includes(testCase.source)) failures.push('説明がmetadataを使用していません');
            }
          }
          results.push({testCase:{name:`L-COND1.1 ${testCase.name}`}, result:{passed:failures.length === 0, failures,
            actual:{output:'説明とDecision Cardを確認', warningCount:0}}});
        }
        return results;
      }catch(error){
        return cases.map(testCase => ({testCase:{name:`L-COND1.1 ${testCase.name}`},
          result:{passed:false, failures:[String(error)], actual:{output:'', warningCount:0}}}));
      }finally{
        frame.remove();
      }
    }

    async function checkSelectionPaletteUiCases(){

          .filter(node => node.textContent.trim());

    // Phase 2: verify the recorded trace against independent input/expected values.
    function checkPhase2Trace(bridge, expected, failures){
      const steps=bridge.steps, tagged=steps.filter(s=>s.loopDecision?.kind==='while');
      if(expected.decisions && tagged.length!==expected.decisions.length)failures.push(`WHILE判定数: 期待${expected.decisions.length} / 実際${tagged.length}`);
      for(const [index,wanted] of (expected.decisions||[]).entries()){
        const step=tagged[index],d=step?.loopDecision;
        if(!d){failures.push(`WHILE判定${index+1}がない`);continue;}
        for(const [key,value] of Object.entries(wanted)){
          if(key==='leftValue'||key==='rightValue'){
            const side=key==='leftValue'?'left':'right';
            if(d.comparison?.[side]?.value!==value)failures.push(`WHILE ${index+1} ${key}が違う`);
          }else if(key==='operator'){
            if(d.comparison?.operator!==value)failures.push(`WHILE ${index+1} 演算子が違う`);
          }else if(JSON.stringify(d[key])!==JSON.stringify(value))failures.push(`WHILE ${index+1} ${key}: ${JSON.stringify(d[key])} / 期待${JSON.stringify(value)}`);
        }
      }
      for(const step of tagged){
        const d=step.loopDecision;
        if(d.kind!=='while'||d.depth!==1||d.headerLineNo!==step.lineNo||d.sourceId!==`while:${step.lineNo}`||
          typeof d.condition!=='string'||typeof d.evaluatedDisplay!=='string'||typeof d.evaluatedValue!=='number'||
          !Number.isFinite(d.evaluatedValue)||typeof d.result!=='boolean'||d.result!==(d.evaluatedValue!==0)||
          !Number.isInteger(d.iteration)||d.iteration!==d.enteredCount+1||
          d.nextAction!==(d.result?(d.enteredCount>=500?'limit':'body'):'exit'))failures.push('WHILE metadata契約が不正');
        if(d.comparison){
          for(const side of ['left','right'])if(typeof d.comparison[side].source!=='string'||typeof d.comparison[side].display!=='string'||!Number.isFinite(d.comparison[side].value))failures.push('WHILE比較値契約が不正');
        }
        if(!Array.isArray(step.variablesAtStep)||typeof step.outputAtStep!=='string')failures.push('条件snapshotがない');
        const previous=steps[steps.indexOf(step)-1];
        if(previous&&(JSON.stringify(previous.variablesAtStep)!==JSON.stringify(step.variablesAtStep)||previous.outputAtStep!==step.outputAtStep))failures.push('条件判定が変数/出力を変えている');
      }
      for(const step of steps.filter(s=>s.stepKind==='loop-omission'))if(step.loopDecision)failures.push('省略STEPに条件metadataが混入');
      if(expected.equivalentTo){
        const original={output:bridge.output,variables:bridge.variables,hasWarnings:bridge.hasWarnings};
        document.getElementById('codeInput').value=expected.equivalentTo;visualizeCode();
        const other=window.cVisualizerLiteResult;
        if(JSON.stringify(original)!==JSON.stringify({output:other.output,variables:other.variables,hasWarnings:other.hasWarnings}))failures.push('通常代入/FORとの結果・最終変数が非等価');
      }
    }

    async function checkPhase2UiCases(){
      const results=[],frame=createUiTestFrame();
      try{
        await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
        const ui=frame.contentWindow,doc=ui.document,cm=doc.querySelector('.CodeMirror').CodeMirror;
        const errors=[];ui.addEventListener('error',event=>errors.push(event.message));
        for(const test of testCases.filter(t=>t.expect.phase2Ui)){
          const failures=[];
          try{
            cm.setValue(test.code);doc.getElementById('scanfInput').value='';doc.getElementById('visualize').click();
            const isError=!!test.expect.warningMin;
            if(isError){
              const limit=ui.cVisualizerLiteResult.steps.findLast(s=>s.loopDecision?.nextAction==='limit');
              const card=doc.querySelector('.failure-state .while-decision-card');
              if(!limit||!card||!card.textContent.includes('TRUE')||!card.textContent.includes('安全上限に達したため停止')||card.textContent.includes('FALSE'))failures.push('上限TRUEカードがエラー画面にない');
              if(doc.querySelector('.result-state')||!doc.getElementById('step-controls').hidden||ui.eval('hasCurrentResult()')||doc.querySelector('.is-run-success'))failures.push('安全停止を成功扱い');
            }else{
              await waitForUiResult(ui);
              const steps=ui.cVisualizerLiteResult.steps,frozen=JSON.stringify(steps);
              if(steps.filter(s=>s.loopDecision?.kind==='while').length!==test.expect.phase2.decisions.length)failures.push('UI対象のWHILE判定metadataが欠落');
              doc.querySelector('.result-flow-button').click();
              for(let index=0;index<steps.length;index++){
                const step=steps[index],d=step.loopDecision;
                const card=doc.querySelector('#flow-content .while-decision-card');
                if(d?.kind==='while'){
                  if(!card){failures.push(`STEP${index+1}: WHILEカードなし`);}
                  else{
                    const values=d.comparison?`${d.comparison.left.display} ${d.comparison.operator} ${d.comparison.right.display}`:`${d.condition} → ${d.evaluatedDisplay}`;
                    if(card.querySelector('.decision-values')?.textContent!==values||!card.textContent.includes(d.result?'TRUE':'FALSE')||!card.textContent.includes('WHILE CONDITION')||!card.textContent.includes(`${d.iteration}回目`)||!card.textContent.includes(`${d.headerLineNo}行目`))failures.push('条件カードの値/回数/行が不一致');
                    if(!card.textContent.includes(d.result?'条件が成立→本文へ':'不成立→ループ終了'))failures.push('条件の進行先が不一致');
                  }
                  if(doc.querySelector('#flow-content .value-card'))failures.push('条件で不要な変数変化');
                }else if(card)failures.push('非WHILE条件にWHILEカード');
                if(step.stepKind==='loop-omission'&&doc.querySelector('#flow-content .decision-card'))failures.push('省略に条件カード');
                const shown=doc.getElementById('output-value').textContent;
                if(shown!==step.outputAtStep&&!(shown==='—'&&step.outputAtStep===''))failures.push('STEP出力不一致');
                if(index>0){doc.getElementById('step-prev').click();doc.getElementById('step-next').click();}
                doc.getElementById('step-next').click();
              }
              if(!doc.querySelector('.result-state'))failures.push('RESULT復帰なし');
              if(JSON.stringify(steps)!==frozen)failures.push('往復でmetadata/snapshot変更');
            }
          }catch(e){failures.push(String(e));}
          if(errors.length)failures.push(...errors.splice(0));
          results.push({testCase:{name:test.name+' UIカード往復'},result:{passed:!failures.length,failures,actual:{output:'WHILEカード・FLOW・STEP',warningCount:0}}});
        }
      }finally{frame.remove();}
      return results;
    }

    async function checkPhase1UiCases(){
      const results=[], frame=createUiTestFrame();
      try{
        await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
        const ui=frame.contentWindow,doc=ui.document,cm=doc.querySelector('.CodeMirror').CodeMirror;
        const errors=[];ui.addEventListener('error',event=>errors.push(event.message));
        for(const test of testCases.filter(t=>t.expect.phase1?.omissions)){
          const failures=[];
          try{
            cm.setValue(test.code);doc.getElementById('scanfInput').value='';doc.getElementById('visualize').click();
            await waitForUiResult(ui);
            const steps=ui.cVisualizerLiteResult.steps;
            const frozen=JSON.stringify(steps);
            doc.querySelector('.result-flow-button').click();
            for(const [index,step] of steps.entries()){
              if(!step.text.includes('省略'))continue;
              ui.eval('activeStep = '+index+'; renderStep()');
              for(let repeat=0;repeat<2;repeat++){
                if(doc.getElementById('output-value').textContent!==step.outputAtStep && !(step.outputAtStep==='' && doc.getElementById('output-value').textContent==='—'))failures.push('省略出力がsnapshotと違う');
                if(doc.querySelector('#flow-content .value-card,#flow-content .decision-card'))failures.push('省略を変数更新/条件カードとして表示');
                doc.getElementById('step-next').click();
                const fake=[...doc.querySelectorAll('.scalar-variable-history')].map(n=>n.textContent);
                if(fake.some(t=>t.includes('— →')))failures.push('省略後に偽の初期化表示');
                doc.getElementById('step-prev').click();
              }
              doc.getElementById('step-prev').click();doc.getElementById('step-next').click();
            }
            ui.eval('activeStep = '+(steps.length-1)+'; renderStep()');doc.getElementById('step-next').click();
            if(!doc.querySelector('.result-state'))failures.push('最後からRESULTに戻れない');
            doc.querySelector('.result-flow-button').click();doc.getElementById('step-prev').click();
            if(!doc.querySelector('.result-state'))failures.push('先頭からRESULTに戻れない');
            if(JSON.stringify(steps)!==frozen)failures.push('往復操作がsnapshotを変更した');
          }catch(e){failures.push(String(e));}
          if(errors.length)failures.push(...errors.splice(0));
          results.push({testCase:{name:test.name+' UI往復'},result:{passed:!failures.length,failures,actual:{output:'省略FLOW・前後・RESULT',warningCount:0}}});
        }
      }finally{frame.remove();}
      return results;
    }

    // UI-FONT1: CodeMirror専用文字サイズの回帰。結果・FLOW・CodeMirror入力を保持する。
    async function checkEditorFontUiCases(){
      const storageKey='c-visualizer-lite:editor-font-size:v1';
      let savedFontSize=null;
      try{
        savedFontSize=localStorage.getItem(storageKey);
        localStorage.removeItem(storageKey);
      }catch(_error){ /* 保存禁止でもUI検査は継続する。 */ }
      const results=[], frame=createUiTestFrame();
      const record=(name,failures)=>results.push({
        testCase:{name:'UI-FONT1 '+name},
        result:{passed:!failures.length,failures,actual:{output:'CODE専用サイズ操作',warningCount:0}}
      });
      try{
        await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
        const ui=frame.contentWindow,doc=ui.document;
        const cm=doc.querySelector('.CodeMirror').CodeMirror;
        const wrapper=cm.getWrapperElement();
        const increase=doc.getElementById('editor-font-increase');
        const decrease=doc.getElementById('editor-font-decrease');
        const reset=doc.getElementById('editor-font-reset');
        const light=doc.getElementById('editor-light-toggle');
        const size=()=>Math.round(Number.parseFloat(ui.getComputedStyle(wrapper).fontSize));
        const failures=[];
        const initial=size();
        const codeBefore=cm.getValue();
        const flowSize=ui.getComputedStyle(doc.getElementById('flow-content')).fontSize;
        const resultSize=ui.getComputedStyle(doc.getElementById('summary-output')).fontSize;
        if(initial!==14)failures.push(`iframe PC初期サイズは14pxを期待: ${initial}`);
        if(reset.textContent!==`${initial}px`)failures.push('サイズ表示の初期値が違います');
        if(!(increase.getBoundingClientRect().right <= light.getBoundingClientRect().left))failures.push('拡大操作がLightの左にありません');
        record('初期値・Light左配置',failures);

        increase.click();
        const plusFailures=[];
        if(size()!==initial+2)plusFailures.push(`A+で2px拡大されない: ${size()}`);
        if(reset.textContent!==`${initial+2}px`)plusFailures.push('サイズ表示が追従しません');
        if(cm.getValue()!==codeBefore)plusFailures.push('操作時にコードが変更されました');
        if(ui.getComputedStyle(doc.getElementById('flow-content')).fontSize!==flowSize)plusFailures.push('FLOW文字サイズが変更されました');
        if(ui.getComputedStyle(doc.getElementById('summary-output')).fontSize!==resultSize)plusFailures.push('RESULT文字サイズが変更されました');
        record('CODE限定拡大・他領域保持',plusFailures);

        decrease.click();
        record('A−で元のサイズへ',size()===initial?[]:[`戻り値 ${size()}px`]);

        for(let i=0;i<16;i++)increase.click();
        const maxFailures=[];
        if(size()!==26)maxFailures.push(`最大は26px: ${size()}`);
        if(!increase.disabled)maxFailures.push('最大値でA+が無効になりません');
        record('26px上限',maxFailures);

        for(let i=0;i<16;i++)decrease.click();
        const minFailures=[];
        if(size()!==12)minFailures.push(`最小は12px: ${size()}`);
        if(!decrease.disabled)minFailures.push('最小値でA−が無効になりません');
        record('12px下限',minFailures);

        reset.click();
        const resetFailures=[];
        if(size()!==initial)resetFailures.push(`初期値に戻らない: ${size()}px`);
        if(wrapper.style.fontSize)resetFailures.push('インラインCSSが除去されていません');
        light.click();increase.click();
        if(size()!==initial+2)resetFailures.push('Lightでの拡大ができません');
        if(!doc.querySelector('.editor-frame').classList.contains('is-light'))resetFailures.push('Light状態が保持されません');
        record('標準復帰・Light併用',resetFailures);

        // オフラインでも保存禁止設定でも動作自体は継続できる設計。
        // 通常HTTPでのlocalStorage永続化はブラウザE2Eで追加確認する。
        const errorFailures=[];
        try{
          cm.setCursor(1,0);
          cm.refresh();
          if(!doc.querySelector('.CodeMirror-linenumber'))errorFailures.push('行番号が表示されません');
          if(cm.getValue()!==codeBefore)errorFailures.push('コードが保持されません');
          reset.click();
          frame.style.width='390px';
          await new Promise(resolve=>ui.setTimeout(resolve,100));
          if(size()!==12 || reset.textContent!=='12px' || !decrease.disabled)errorFailures.push('小画面の標準サイズ・操作表示が追従しません');
          frame.style.width='1200px';
          await new Promise(resolve=>ui.setTimeout(resolve,100));
          if(size()!==14 || reset.textContent!=='14px' || decrease.disabled)errorFailures.push('PC標準サイズ・操作表示が追従しません');
        }catch(error){errorFailures.push(String(error));}
        record('CodeMirror refresh・行番号',errorFailures);
      }catch(error){record('実行例外',[String(error)]);}
      finally{
        frame.remove();
        try{
          if(savedFontSize===null)localStorage.removeItem(storageKey);
          else localStorage.setItem(storageKey,savedFontSize);
        }catch(_error){ /* 保存禁止設定を維持する。 */ }
      }
      return results;
    }

    async function runAllTests(){
      const results = testCases.map(testCase => ({ testCase, result:checkCase(testCase) }));
      results.push(...await checkDecisionUiCases());
      results.push(...await checkScanfUiCases());
      results.push(...await checkMainCompatibilityUiCases());
      results.push(...await checkReturnHintUiCases());
      results.push(...await checkProgressiveResultUiCases());
      results.push(...await checkInputInjectionUiCases());
      results.push(...await checkExpandedSampleUiCases());
      results.push(...await checkSelectionPaletteUiCases());
      results.push(...await checkPhase1UiCases());
      results.push(...await checkPhase2UiCases());
      results.push(...await checkEditorFontUiCases());
      const passed = results.filter(item => item.result.passed).length;
      const failed = results.length - passed;

      document.getElementById('totalCount').textContent = results.length;
      document.getElementById('passCount').textContent = passed;
      document.getElementById('failCount').textContent = failed;
      document.title = failed === 0
        ? `✓ ${passed}/${results.length} C Code Visualizer 回帰テスト`
        : `✗ ${failed}件失敗 C Code Visualizer 回帰テスト`;

      document.getElementById('testResults').innerHTML = results.map(({ testCase, result }) => {
        const detail = result.passed
          ? `出力: ${result.actual.output}\n警告: ${result.actual.warningCount}件`
          : result.failures.join('\n');
        return `
          <article class="test-row">
            <span class="badge ${result.passed ? 'badge-pass' : 'badge-fail'}">${result.passed ? 'PASS' : 'FAIL'}</span>
            <div class="test-name">${escapeTestHtml(testCase.name)}</div>
            <div class="test-detail">${escapeTestHtml(detail)}</div>
          </article>
        `;
      }).join('');
    }

    document.getElementById('runTests').addEventListener('click', runAllTests);
    runAllTests();
  </script>
