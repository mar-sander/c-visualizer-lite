<!doctype html><meta charset="utf-8"><title>L-MASK2 RC1 visibility tests</title>
<h1>L-MASK2 RC1 — Unified Revealed Mask Outline</h1><pre id="counts">実行中</pre><ol id="results"></ol>
<script>
(async()=>{
  const rows=[],record=(name,pass)=>rows.push({name,pass:!!pass});
  const key='c-visualizer-lite-unlocks-v1',saved=localStorage.getItem(key);
  const frame=document.createElement('iframe');frame.style.cssText='width:1200px;height:800px;border:0';
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  try{
    localStorage.setItem(key,JSON.stringify({version:1,unlocked:['mask']}));
    const loaded=new Promise(r=>frame.onload=r);frame.src='index.html';document.body.append(frame);await loaded;
    const ui=frame.contentWindow,d=ui.document,cm=d.querySelector('.CodeMirror').CodeMirror;
    const code='#include <stdio.h>\nint main(void){\nint value = 42;\nprintf("%d", value);\nreturn 0;\n}';
    const colors=()=>{
      const pre=d.querySelectorAll('.CodeMirror-code pre')[2],walker=d.createTreeWalker(pre,ui.NodeFilter.SHOW_TEXT),out=[];
      while(walker.nextNode()){const n=walker.currentNode;for(const c of n.textContent)out.push([c,ui.getComputedStyle(n.parentElement).color]);}return out;
    };
    for(const light of [false,true]){
      const label=light?'Light':'Dark';
      d.querySelector('.editor-frame').classList.toggle('is-light',light);cm.setValue(code);cm.clearHistory();await wait(50);
      const before=colors();
      if(d.getElementById('editor-mask-toggle').getAttribute('aria-pressed')==='false')d.getElementById('editor-mask-toggle').click();
      cm.setSelection({line:2,ch:0},{line:2,ch:15});cm.getWrapperElement().dispatchEvent(new ui.KeyboardEvent('keyup',{key:'Shift',bubbles:true}));await wait(180);
      let el=d.querySelector('[data-code-mask]'),css=ui.getComputedStyle(el);
      record(label+' 非開示の黄色と透明文字を維持',css.backgroundColor==='rgb(255, 230, 0)'&&css.color==='rgba(0, 0, 0, 0)');
      record(label+' 非開示枠を維持',css.boxShadow.includes('rgb(214, 188, 0)'));
      for(const type of ['pointerdown','pointerup'])el.dispatchEvent(new ui.PointerEvent(type,{pointerId:5,clientX:10,clientY:10,bubbles:true}));
      el=d.querySelector('.cm-code-mask-open');css=ui.getComputedStyle(el);
      record(label+' 開示枠は黄色48%',css.boxShadow.includes('rgba(214, 188, 0, 0.48)'));
      record(label+' 開示背景は黄色6%',css.backgroundColor==='rgba(255, 230, 0, 0.06)');
      record(label+' シンタックス文字色不変',JSON.stringify(colors())===JSON.stringify(before));
      record(label+' 本文・コードUndo不変',cm.getValue()===code&&cm.historySize().undo===0);
      await wait(400);
      for(const text of ['a[1]', '= 50;', 'main(void)', 'data[i] + 10', 'printf("%d\\n", a[1]);', 'x']){
        cm.setValue(text);await wait(30);
        cm.setSelection({line:0,ch:0},{line:0,ch:text.length});
        cm.getWrapperElement().dispatchEvent(new ui.KeyboardEvent('keyup',{key:'Shift',bubbles:true}));await wait(180);
        el=d.querySelector('[data-code-mask]');
        for(const type of ['pointerdown','pointerup'])el.dispatchEvent(new ui.PointerEvent(type,{pointerId:5,clientX:10,clientY:10,bubbles:true}));
        const spans=[...d.querySelectorAll('.cm-code-mask-open')];
        record(label+' '+text+' 範囲両端だけ縦線',
          spans.filter(s=>s.classList.contains('cm-code-mask-start')).length===1&&
          spans.filter(s=>s.classList.contains('cm-code-mask-end')).length===1&&
          spans.every((s,i)=>{
            const edges=(ui.getComputedStyle(s).boxShadow.match(/inset/g)||[]).length;
            return edges===(spans.length===1?1:(i===0||i===spans.length-1?3:2));
          }));
        const rects=spans.map(s=>s.getBoundingClientRect());
        record(label+' '+text+' 上下線連続・字間不変',rects.length>0&&rects.every((r,i)=>!i||(Math.abs(rects[i-1].right-r.left)<.1&&Math.abs(rects[i-1].top-r.top)<.1&&Math.abs(rects[i-1].bottom-r.bottom)<.1)));
        await wait(400);
      }
    }
  }catch(e){record('例外 '+e.stack,false)}finally{frame.remove();saved===null?localStorage.removeItem(key):localStorage.setItem(key,saved)}
  window.maskVisibilityResults={total:rows.length,pass:rows.filter(r=>r.pass).length,fail:rows.filter(r=>!r.pass).length,rows};
  document.getElementById('counts').textContent=JSON.stringify({...window.maskVisibilityResults,rows:undefined});
  rows.forEach(r=>{const li=document.createElement('li');li.textContent=(r.pass?'PASS ':'FAIL ')+r.name;document.getElementById('results').append(li)});
})();
</script>
