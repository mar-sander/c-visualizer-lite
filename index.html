<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d0d">
  <title>C Code Visualizer Lite | 四則演算 学習版</title>
  <link rel="stylesheet" href="vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">C<span>.</span></span>
        <div><strong>C CODE VISUALIZER -LITE-</strong><small>四則演算 学習版</small></div>
      </div>
      <label class="sample-picker" for="sample-select">
        <span>サンプル</span>
        <select id="sample-select" aria-label="サンプルコード">
          <option value="">自分で書く</option>
          <option value="add">足し算</option>
          <option value="sub">引き算</option>
          <option value="mul">掛け算</option>
          <option value="div">割り算</option>
          <option value="all">四則演算まとめ</option>
          <option value="precedence">括弧と計算順序</option>
        </select>
      </label>
    </header>
    <main>
      <div class="workspace">
        <section class="panel code-panel" aria-label="01 / CODE">
          <div class="panel-heading"><span class="section-index">01 / CODE</span></div>
          <div class="editor-guide">
            <span><i class="legend-cursor"></i> カーソル位置</span>
            <span><i class="legend-execution"></i> 実行位置</span>
          </div>
          <div class="editor-frame">
            <textarea id="code-input" aria-label="C言語のコード入力欄" spellcheck="false">#include &lt;stdio.h&gt;

int main(void){
    printf("Hellow World");
    return 0;
}</textarea>
          </div>
          <button type="button" id="visualize" class="visualize-button" aria-label="RUN：処理を可視化する">
            <span class="play-icon" aria-hidden="true">▶</span><span>RUN</span>
          </button>
        </section>
        <section class="action-area" aria-label="最終状態サマリー">
          <div class="final-summary" role="status" aria-live="polite">
            <div><span>実行結果</span><strong id="summary-output">—</strong></div>
            <div><span>変数</span><div id="summary-variables" class="summary-variables">—</div></div>
          </div>
          <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
        </section>
        <section class="panel flow-panel" aria-label="02 / FLOW">
          <div class="panel-heading"><span class="section-index">02 / FLOW</span></div>
          <div id="flow-content" class="flow-content" aria-live="polite" aria-atomic="true"></div>
          <div class="output-card" role="status" aria-live="polite" aria-atomic="true">
            <div><span class="output-heading">OUTPUT / 出力結果</span><span id="output-state" class="output-state">まだ出力されていません</span></div>
            <output id="output-value">—</output>
          </div>
          <div id="step-controls" class="step-controls" aria-label="STEP操作">
            <button type="button" id="step-prev" class="step-button" disabled>← 前へ</button>
            <span id="step-count" class="step-count">— / —</span>
            <button type="button" id="step-next" class="step-button" disabled>次へ →</button>
          </div>
        </section>
      </div>
      <p class="footnote">C言語の対応範囲で処理を可視化します。1行に1つの文を書いてください。完全なコンパイラや正誤判定ではありません。</p>
    </main>
  </div>
  <!-- 既存解析エンジンの入出力先。画面へは解析済みの実データを反映します。 -->
  <div class="engine-sandbox" aria-hidden="true">
    <div id="codeEditor"><pre id="codeLineNumbers"></pre><pre id="codeHighlight"></pre></div>
    <textarea id="codeInput"></textarea><textarea id="scanfInput"></textarea>
    <div id="outputResult"></div><div id="variableState"></div>
    <div id="stepResult"></div><div id="codePreview"></div><div id="hintResult"></div>
  </div>
  <script src="vendor/codemirror/codemirror.js"></script>
  <script src="vendor/codemirror/clike.js"></script>
  <script src="vendor/codemirror/matchbrackets.js"></script>
  <script src="script.js"></script>
  <script src="app.js"></script>
</body>
</html>
