<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L-FUNC5 FA1 セッション独立検証</title><style>body{margin:20px;background:#181818;color:#eee;font:14px system-ui}iframe{width:100%;height:850px;border:1px solid #666}pre{white-space:pre-wrap}.fail{color:#ff9494}</style><h1>FA1 完了後INPUTの独立検証</h1><p>製品に読み込まない検証専用ページ。各検査で画面・履歴を初期化します。</p><div id="report">実行中</div><iframe id="product" title="製品操作検証"></iframe><script src="tests-function-input-stage5.js"></script><script src="tests-function-session-fa1.js"></script><script>
(async()=>{let seq=0;const frame=document.getElementById('product');const r=await FunctionSessionFA1Tests.run(()=>new Promise(resolve=>{frame.onload=()=>resolve(frame.contentWindow);frame.src='index.html?fa1-test='+(++seq);}));window.functionSessionFA1Results=r;document.getElementById('report').textContent=r.passed+'/'+r.total+' PASS、'+r.failed+' FAIL';for(const row of r.rows){const p=document.createElement('pre');p.textContent=(row.pass?'PASS ':'FAIL ')+row.name+(row.error?'\n'+row.error:'');if(!row.pass)p.className='fail';document.body.append(p);}})();
</script></html>
